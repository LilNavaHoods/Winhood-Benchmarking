name: WinHood Multiplatform CI & Windows Desktop Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux-validation:
    name: Linux Fullstack, Determinism, Coverage & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json integrity
        run: node -e "const fs=require('fs'); if(!fs.existsSync('package-lock.json')) { console.error('Missing package-lock.json'); process.exit(1); } const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if(!lock.lockfileVersion || !lock.packages) { console.error('Invalid package-lock.json'); process.exit(1); }"

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run full test suite with coverage report
        run: npm run test:coverage

      - name: Verify bit-for-bit determinism across repeated CLI runs
        run: |
          OUT1=$(npx tsx cli/winhood-cli.ts analyze --path ./src/analyzers --deterministic --name WinHoodAnalyzers)
          OUT2=$(npx tsx cli/winhood-cli.ts analyze --path ./src/analyzers --deterministic --name WinHoodAnalyzers)
          if [ "$OUT1" != "$OUT2" ]; then
            echo "ERROR: Bit-for-bit determinism check failed!"
            exit 1
          fi
          echo "Determinism verified: identical output across consecutive runs."

      - name: Dogfooding self-audit with WinHood CLI Quality Gate
        run: npx tsx cli/winhood-cli.ts gate --path ./src/gate --gate-id winhood-standard-v2 --deterministic

      - name: Dependency vulnerability check (npm audit --audit-level=high)
        run: npm audit --audit-level=high || true

      - name: Build frontend and desktop bundles
        run: npm run build:desktop

  windows-desktop-validation:
    name: Windows Desktop Lifecycle, userData & Packaging Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 on Windows
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json integrity
        run: node -e "const fs=require('fs'); if(!fs.existsSync('package-lock.json')) { console.error('Missing package-lock.json'); process.exit(1); } const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if(!lock.lockfileVersion || !lock.packages) { console.error('Invalid package-lock.json'); process.exit(1); }"

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Typecheck on Windows
        run: npm run lint

      - name: Run Windows path, scanner .bat/.cmd, and desktop lifecycle tests
        run: npm test

      - name: Build desktop bundle and SHA-256 manifest on Windows
        run: npm run build:desktop

      - name: Upload desktop build manifest
        uses: actions/upload-artifact@v4
        with:
          name: winhood-desktop-build-manifest
          path: dist-desktop/build-manifest.json
