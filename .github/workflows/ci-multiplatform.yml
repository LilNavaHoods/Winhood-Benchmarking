name: WinHood Multiplatform CI, Coverage Gate & Dogfooding Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux Fullstack, Independent Positioning, Coverage Gate & Self-Audit Dogfooding
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json integrity
        run: node -e "const fs=require('fs'); if(!fs.existsSync('package-lock.json')) { console.error('Missing package-lock.json'); process.exit(1); } const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if(!lock.lockfileVersion || !lock.packages) { console.error('Invalid package-lock.json'); process.exit(1); }"

      - name: Verify zero third-party brand anchoring in README, docs, UI & production code
        run: |
          PROHIBITED_BRAND="sonar""qube"
          if grep -riI "$PROHIBITED_BRAND" README.md docs/ src/ server.ts cli/ packages/ integrations/ examples/ templates/ ; then
            echo "ERROR: Found prohibited third-party reference in codebase/docs!"
            exit 1
          fi
          echo "Independent positioning verified: 0 occurrences."

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run full test suite with Coverage Threshold Gate (>=80% global, >=95% critical motors)
        run: npm run test:coverage

      - name: Upload HTML Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winhood-coverage-html-report
          path: coverage/

      - name: Verify bit-for-bit determinism across repeated CLI runs
        run: |
          OUT1=$(./node_modules/.bin/tsx cli/winhood-cli.ts analyze --path ./src/analyzers --deterministic --name WinHoodAnalyzers)
          OUT2=$(./node_modules/.bin/tsx cli/winhood-cli.ts analyze --path ./src/analyzers --deterministic --name WinHoodAnalyzers)
          if [ "$OUT1" != "$OUT2" ]; then
            echo "ERROR: Bit-for-bit determinism check failed!"
            exit 1
          fi
          echo "Determinism verified: identical output across consecutive runs."

      - name: Dogfooding 1 — Run official WinHood GitHub Action against WinHood repository
        id: winhood_dogfood_action
        uses: ./integrations/github-action
        with:
          path: "./src/gate"
          gate: "winhood-standard-v2"
          profile: "mqr-strict"
          fail-on: "BLOCKED"
          sarif-output: "winhood-self-audit.sarif"

      - name: Dogfooding 2 — Run WinHood VS Code Extension against WinHood repository
        run: ./node_modules/.bin/tsx --test packages/vscode-extension/test/extension.integration.test.ts

      - name: Build frontend and desktop bundles
        run: npm run build:desktop

  windows-desktop-validation:
    name: Windows Desktop Lifecycle, userData & Packaging Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 on Windows
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json integrity
        run: node -e "const fs=require('fs'); if(!fs.existsSync('package-lock.json')) { console.error('Missing package-lock.json'); process.exit(1); } const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); if(!lock.lockfileVersion || !lock.packages) { console.error('Invalid package-lock.json'); process.exit(1); }"

      - name: Install dependencies deterministically without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Typecheck on Windows
        run: npm run lint

      - name: Run Windows path, scanner .bat/.cmd, and desktop lifecycle tests
        run: npm test

      - name: Build desktop bundle and SHA-256 manifest on Windows
        run: npm run build:desktop

      - name: Upload desktop build manifest
        uses: actions/upload-artifact@v4
        with:
          name: winhood-desktop-build-manifest
          path: dist-desktop/build-manifest.json
