name: WinHood Audit & PR Gate Example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  winhood-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Run WinHood Action (MQR Mode)
        id: winhood
        uses: ./integrations/github-action
        with:
          path: "."
          gate: "winhood-standard-v2"
          profile: "mqr-strict"
          fail-on: "BLOCKED"
          sarif-output: "winhood-results.sarif"

      - name: Upload SARIF 2.1.0 to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          sarif_file: ${{ steps.winhood.outputs.report-path }}

