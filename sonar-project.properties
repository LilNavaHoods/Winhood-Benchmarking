# WinHood Benchmarking — SonarCloud / SonarQube Scanner Configuration
# Exclui artefatos gerados de build (esbuild/Vite), dependências, dados em runtime e testes da varredura de código-fonte.
sonar.projectKey=winhood-benchmarking
sonar.sources=src,server.ts,electron-main.ts,electron-preload.ts
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=dist/**,dist-desktop/**,coverage/**,node_modules/**,.winhood_data/**,public/assets/**,**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8
