# WinHood Benchmarking v4.4.0 — SonarCloud Configuration
# Verified against SonarCloud SaaS (https://sonarcloud.io) for LilNavaHoods/Winhood-Benchmarking
sonar.projectKey=LilNavaHoods_Winhood-Benchmarking
sonar.organization=lilnavahoods
sonar.sources=src,server.ts,electron-main.ts,electron-preload.ts,cli
sonar.tests=src,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.exclusions=dist/**,dist-desktop/**,dist-server/**,coverage/**,node_modules/**,.aistudio/**,examples/**,integrations/**,release-windows/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Synthetic intentionally-vulnerable SAST/Secret validation corpora & pure TypeScript type definitions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/types/**,src/engine/realSampleRepositories.ts,src/intelligence/datasets/GoldenDatasetCorpus.ts,src/validation/CrossToolBenchmarkHarness.ts
sonar.cpd.exclusions=src/engine/realSampleRepositories.ts,src/intelligence/datasets/GoldenDatasetCorpus.ts,src/validation/CrossToolBenchmarkHarness.ts,src/types/**

# Scope-limited issue ignore strictly for synthetic intentionally-vulnerable benchmark fixtures (never production code)
sonar.issue.ignore.multicriteria=corpus1,corpus2,corpus3
sonar.issue.ignore.multicriteria.corpus1.ruleKey=*
sonar.issue.ignore.multicriteria.corpus1.resourceKey=src/engine/realSampleRepositories.ts
sonar.issue.ignore.multicriteria.corpus2.ruleKey=*
sonar.issue.ignore.multicriteria.corpus2.resourceKey=src/intelligence/datasets/GoldenDatasetCorpus.ts
sonar.issue.ignore.multicriteria.corpus3.ruleKey=*
sonar.issue.ignore.multicriteria.corpus3.resourceKey=src/validation/CrossToolBenchmarkHarness.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
