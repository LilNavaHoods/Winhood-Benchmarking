<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="wh-pulse-wini-arc" x1="24" y1="84" x2="136" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="wh-pulse-sla-w" x1="38" y1="36" x2="122" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#31d6c4" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="wh-pulse-glow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#31d6c4" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0c1017" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Squircle Adaptativo -->
  <rect x="4" y="4" width="152" height="152" rx="34" fill="#0c1017" stroke="#1e293b" stroke-width="2.5" />
  <circle cx="80" cy="82" r="64" fill="url(#wh-pulse-glow)" />

  <!-- Arco de Suporte Segmentado Inferior (Wini IA Purple -> Indigo -> Cyan Blue) -->
  <g stroke="url(#wh-pulse-wini-arc)" fill="none" stroke-linecap="round">
    <path d="M 26 84 A 54 54 0 0 0 134 84" stroke-width="5.5" />
    <path d="M 35 84 A 45 45 0 0 0 125 84" stroke-width="4.5" stroke-opacity="0.92" />
    <path d="M 44 84 A 36 36 0 0 0 116 84" stroke-width="3.5" stroke-opacity="0.82" />
    <line x1="25" y1="84" x2="45" y2="84" stroke-width="4.5" />
    <line x1="115" y1="84" x2="135" y2="84" stroke-width="4.5" />
  </g>

  <!-- Divisórias Radiais Técnicas de Segmentação do Arco -->
  <g stroke="#0c1017" stroke-width="3" stroke-linecap="butt">
    <line x1="51" y1="101" x2="32" y2="112" />
    <line x1="68" y1="117" x2="60" y2="137" />
    <line x1="92" y1="117" x2="100" y2="137" />
    <line x1="109" y1="101" x2="128" y2="112" />
  </g>

  <!-- Duplo Chevron "W" Superior (SLA Turquesa #31d6c4 -> #10b981) -->
  <g stroke="url(#wh-pulse-sla-w)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38 38 L 62 96 L 80 54 L 98 96 L 122 38" stroke-width="7.5" />
    <path d="M 48 38 L 62 73 L 80 36 L 98 73 L 112 38" stroke-width="5" />
  </g>
</svg>
